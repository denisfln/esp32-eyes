; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32@6.7.0
; There is no dedicated PlatformIO board definition for the generic
; "ESP32-C3 Super Mini" clone boards, so the closest official Espressif
; ESP32-C3 board is used instead - it matches the Super Mini's chip,
; 4MB flash and native USB hardware.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The ESP32-C3 Super Mini has no USB-to-serial bridge chip: the USB port is
; wired directly to the C3's native USB peripheral, so these flags are
; required for Serial to work over the USB port.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = olikraus/U8g2@^2.36.5
